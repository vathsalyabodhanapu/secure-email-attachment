<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Management</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="container"><h1>User Management</h1><p><a href="/">Dashboard</a> · <a href="/settings">Settings</a></p>{% with messages=get_flashed_messages() %}{% for m in messages %}<p>{{m}}</p>{% endfor %}{% endwith %}<section class="panel"><h2>Create account</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Username<input name="username" required minlength="3"></label><label>Temporary password (12+ chars)<input type="password" name="password" required minlength="12"></label><label>Role<select name="role"><option>analyst</option><option>viewer</option><option>admin</option></select></label><button class="button">Create user</button></form></section><section class="panel"><h2>Accounts</h2>{% for u in users %}<p>{{u.username}} · {{u.role}} · {{u.created_at}}</p>{% endfor %}</section></main></body></html>
